alerts:
  - name: High end-to-end latency
    severity: high
    condition: latency_p95_ms > 2000
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#llm-ops-alerts'
    owner: llm-platform
    runbook: docs/alerts.md#alert-1
  - name: Elevated request error rate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#llm-ops-alerts'
    owner: api-oncall
    runbook: docs/alerts.md#alert-2
  - name: Degraded answer quality
    severity: medium
    condition: quality_score_avg < 0.75 or retrieval_success_rate_pct < 90
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#llm-ops-alerts'
    owner: llm-quality
    runbook: docs/alerts.md#alert-3
